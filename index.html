<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave Calculator — HydroCalc</title>
  <meta name="description" content="Calculate ocean wave length from period and depth; classify wave theory using the Le Méhaut (1976) applicability diagram." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Wave Calculator</h1>
    <p class="subtitle">Linear dispersion &middot; Newton&ndash;Raphson &middot; Le M&eacute;haut diagram</p>
  </header>

  <main>
    <section class="input-section" aria-label="Wave parameters">
      <form id="wave-form" novalidate>

        <div class="waves-header">
          <span></span>
          <span>T (s)</span>
          <span>d (m)</span>
          <span>H (m) <small>opt.</small></span>
          <span></span>
        </div>

        <div id="wave-rows">
          <!-- rows injected by app.js -->
        </div>

        <div id="row-errors" class="row-errors" role="alert" aria-live="polite" hidden></div>

        <button type="button" id="add-row-btn">+ Add wave</button>

        <button type="submit" id="calculate-btn">Calculate</button>

      </form>
    </section>

    <section class="results-section" id="results" aria-label="Calculation results" hidden>

      <div id="classification-badge" class="classification-badges"></div>

      <div class="props-grid" id="props-grid"></div>

      <p class="formula-note">
        &omega;&sup2; = g &middot; k &middot; tanh(k&thinsp;d) &nbsp;&nbsp;|&nbsp;&nbsp; g = 9.81 m/s&sup2;
      </p>

      <button type="button" id="export-csv-btn" class="secondary-btn" hidden>Export CSV</button>

    </section>

    <section class="theory-section" id="theory-section" aria-label="Wave theory classification" hidden>

      <div class="lehaut-container" id="lehaut-plot" role="img" aria-label="Le Méhaut applicability diagram">
        <!-- SVG injected by app.js -->
      </div>

      <p class="formula-note">
        Le M&eacute;haut (1976) applicability diagram &nbsp;&middot;&nbsp;
        Breaking: Miche (1951) &amp; McCowan (H/d&nbsp;=&nbsp;0.78)
      </p>

      <button type="button" id="save-svg-btn" class="secondary-btn" hidden>Save Plot as SVG</button>

    </section>

    <section class="solver-error-section" id="solver-error" aria-live="assertive" hidden>
      <p id="solver-error-msg"></p>
    </section>
  </main>

  <footer>
    <p>HydroCalc &middot; SI units only &middot; Linear dispersion &amp; Le M&eacute;haut diagram</p>
  </footer>

  <script src="app.js?v=4" defer></script>
</body>
</html>
